[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "ont-guide-aligner"
dynamic = ["version"]  # from Cargo.toml
description = "Count CRISPR sgRNAs in Oxford Nanopore reads, one guide per read, anchored on vector flanks"
readme = "README.md"
license = "MIT AND Zlib"  # Zlib: zlib-rs, compiled into the wheels
license-files = ["LICENSE", "THIRD_PARTY_LICENSES"]
requires-python = ">=3.9"
authors = [{ name = "Jimmy Kim", email = "jimmy.kim@ubc.ca" }]
keywords = ["CRISPR", "sgRNA", "nanopore", "ONT", "screen", "counting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.urls]
Repository = "https://github.com/jimmykim014/ont-guide-aligner"
Issues = "https://github.com/jimmykim014/ont-guide-aligner/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ont-guide-aligner = "ont_guide_aligner.cli:main"

[tool.maturin]
python-source = "python"
module-name = "ont_guide_aligner._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
