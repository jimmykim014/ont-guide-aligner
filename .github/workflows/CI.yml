# Builds abi3 wheels (one per platform, any Python >= 3.9) plus an sdist, and tests them:
# each native wheel, the Linux wheel on the oldest and newest supported Python, the musl wheels
# in Alpine, and an install from the sdist. On a pushed version tag (v*) it checks that the tag
# matches the package version, then publishes to PyPI via trusted publishing. PyPI never accepts
# the same version twice, so every check must pass before anything is uploaded. A manual run
# never publishes to PyPI, even when started on a tag.
# Based on `maturin generate-ci github`.
name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
    # Documentation-only pushes don't rebuild. GitHub doesn't apply path filters to tag pushes,
    # so a release tag always runs.
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Dry run: after all checks pass, upload to TestPyPI (not PyPI)"
        type: boolean
        default: false

# A newer push to the same branch cancels the older run. Release-tag runs are never cancelled,
# so a PyPI publish can't be cut off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  version:
    name: version check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Cargo.toml, CITATION.cff and the release tag agree
        shell: bash
        run: |
          set -e
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          cff=$(sed -n 's/^version: "\(.*\)"/\1/p' CITATION.cff)
          echo "Cargo.toml: $cargo, CITATION.cff: $cff"
          if [ -z "$cargo" ] || [ "$cargo" != "$cff" ]; then
            echo "::error::CITATION.cff version ($cff) doesn't match Cargo.toml ($cargo)"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$cargo" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the package version $cargo"; exit 1
          fi

  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}${{ matrix.manylinux == 'musllinux_1_2' && ' musl' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64, manylinux: auto, test: true }
          - { os: ubuntu-22.04-arm, target: aarch64, manylinux: auto, test: true }
          - { os: ubuntu-22.04, target: x86_64, manylinux: musllinux_1_2, test: false }
          - { os: ubuntu-22.04, target: aarch64, manylinux: musllinux_1_2, test: false }
          - { os: macos-latest, target: aarch64, test: true }
          # Intel wheel on the Apple Silicon runner: tested under Rosetta 2 (see Test wheel)
          - { os: macos-latest, target: x86_64, python-arch: x64, test: true }
          - { os: windows-latest, target: x64, test: true }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}   # empty = the runner's native arch
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Test wheel
        if: ${{ matrix.test }}
        shell: bash
        run: |
          set -e
          # setup-python's x64 Python on an Apple Silicon runner is universal2 and would run as
          # arm64; `arch -x86_64` runs it as x86_64, and its child processes inherit that.
          PY=python
          if [ "$RUNNER_OS" = macOS ] && [ "${{ matrix.python-arch }}" = x64 ]; then PY="arch -x86_64 python"; fi
          $PY -c "import platform; print('Python', platform.python_version(), platform.machine())"
          $PY -m pip install pytest
          $PY -m pip install ont-guide-aligner --no-index --find-links dist --force-reinstall
          cd tests && $PY -m pytest -q
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # The abi3 wheel must work on every Python from 3.9 up; the wheel jobs above test only 3.12.
  test-python:
    name: test Python ${{ matrix.python }}
    needs: wheels
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]   # oldest supported, newest stable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: wheels-ubuntu-22.04-x86_64-auto
          path: dist
      - name: Test wheel
        run: |
          set -e
          python -m pip install pytest
          python -m pip install ont-guide-aligner --no-index --find-links dist
          cd tests && python -m pytest -q

  # musl wheels can't be tested on the glibc runners directly, so run the tests in Alpine.
  test-musl:
    name: test musl ${{ matrix.target }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-ubuntu-22.04-${{ matrix.target }}-musllinux_1_2
          path: dist
      - name: Test wheel in Alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.12-alpine sh -ec '
            pip install --root-user-action=ignore pytest
            pip install --root-user-action=ignore ont-guide-aligner --no-index --find-links dist
            cd tests && python -m pytest -q'

  # A platform without a wheel builds from the sdist; make sure that build works.
  test-sdist:
    name: test sdist install
    needs: sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: wheels-sdist
          path: dist
      - name: Build from the sdist and test
        run: |
          set -e
          python -m pip install pytest
          python -m pip install dist/*.tar.gz
          cd tests && python -m pytest -q

  # Manual dry run of the release: Actions > CI > Run workflow > tick "testpypi", or
  # `gh workflow run CI.yml -f testpypi=true`. Uploads the same files the real release would,
  # to test.pypi.org. A version can only be uploaded once there too; reruns skip files that
  # already exist instead of failing. Safe to start on a release tag: the release job below
  # only runs for tag pushes, never for manual runs.
  testpypi:
    name: Dry run to TestPyPI
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.testpypi }}
    needs: [version, wheels, sdist, test-python, test-musl, test-sdist]
    environment: testpypi
    permissions:
      id-token: write   # TestPyPI trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  release:
    name: Publish to PyPI
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [version, wheels, sdist, test-python, test-musl, test-sdist]
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'dist/*'
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
