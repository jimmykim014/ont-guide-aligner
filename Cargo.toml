[package]
name = "ont_guide_aligner"
version = "1.0.0"
edition = "2021"
description = "Rust counting core for ont-guide-aligner (one guide per ONT read, flank-anchored)"
authors = ["Jimmy Kim <jimmy.kim@ubc.ca>"]
license = "MIT"
repository = "https://github.com/jimmykim014/ont-guide-aligner"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
memchr = "2.8"
ahash = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
